name: Build — VerificadorCitacoes.exe

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master

jobs:
  build-windows:
    name: Gerar .exe no Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências + PyInstaller
        working-directory: verificador_citacoes
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Construir VerificadorCitacoes.exe
        working-directory: verificador_citacoes
        run: pyinstaller verificador.spec --clean --noconfirm

      - name: Verificar tamanho do executável
        run: |
          $size = (Get-Item "verificador_citacoes/dist/VerificadorCitacoes.exe").length / 1MB
          Write-Host "Tamanho: $([math]::Round($size, 1)) MB"

      # Sempre salva como artefato (disponível por 90 dias, download direto pelo GitHub)
      - name: Salvar artefato para download
        uses: actions/upload-artifact@v4
        with:
          name: VerificadorCitacoes-Windows
          path: verificador_citacoes/dist/VerificadorCitacoes.exe
          retention-days: 90

      # Ao criar tag v*, publica Release com link permanente e público
      - name: Publicar Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "Verificador de Citações ${{ github.ref_name }}"
          body: |
            ## ⬇️ Download

            Clique em **VerificadorCitacoes.exe** abaixo para baixar.

            ---

            ### Como usar
            1. Baixe `VerificadorCitacoes.exe`
            2. Clique duas vezes — o navegador abre sozinho
            3. Faça o upload da sua dissertação e das obras de referência
            4. Informe sua chave da API Claude
            5. Clique em **Iniciar Análise**

            ### Requisitos
            - Windows 10 ou superior
            - Conexão com a internet (para a verificação por IA)
            - Nenhuma instalação adicional necessária
          files: verificador_citacoes/dist/VerificadorCitacoes.exe
